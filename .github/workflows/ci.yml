name: CI

# Os mesmos comandos do README, na mesma ordem. Se o CI e a máquina do
# desenvolvedor divergirem, o CI vira ruído e as pessoas param de olhar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Um push novo cancela a execução anterior do mesmo branch — sem fila de builds obsoletos.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Instalar o .NET
        uses: actions/setup-dotnet@v4
        with:
          # A versão vem do global.json: uma fonte só para CI e máquina local.
          global-json-file: global.json

      - name: Cache do NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Directory.Packages.props concentra todas as versões, então é a única
          # entrada que precisa invalidar o cache.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar ferramentas
        run: dotnet tool restore

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Pacotes vulneráveis
        # Inclui os transitivos; qualquer vulnerabilidade conhecida quebra o build.
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulneraveis.txt
          ! grep -q "has the following vulnerable packages" vulneraveis.txt

      - name: Conferir formatação
        run: dotnet csharpier check .

      - name: Compilar
        # --warnaserror: aviso de analisador não vira dívida silenciosa.
        run: dotnet build --no-restore --warnaserror -c Release

      - name: Testes unitários
        run: dotnet test tests/Backend.UnitTests --no-build -c Release

      - name: Testes de integração
        # O runner do GitHub já tem Docker; o Testcontainers sobe o Postgres sozinho.
        run: dotnet test tests/Backend.IntegrationTests --no-build -c Release

  segredos:
    # Varre o histórico inteiro com as regras padrão do gitleaks. Os segredos de
    # appsettings.Development.json são de dev, versionados de propósito, e não casam com elas.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Varrer segredos
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact

  imagens:
    # Só confirma que as imagens constroem. Publicar é outro workflow, com credenciais.
    runs-on: ubuntu-latest
    needs: build-e-testes

    strategy:
      matrix:
        alvo: [api, worker, migrations]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagem (${{ matrix.alvo }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.alvo }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
