# Ambiente completo para desenvolvimento: banco, migrations, API e worker.
#
#   docker compose up --build
#
# A API sobe em http://localhost:8080 e a documentação em http://localhost:8080/scalar.
#
# Para rodar só o banco e depurar a API pela IDE (o fluxo mais comum no dia a dia):
#   docker compose up postgres

name: backend

# Âncora YAML: a string de conexão aparece em três serviços; definida uma vez aqui.
x-conexao: &conexao >-
  Host=postgres;Port=5432;Database=${POSTGRES_DB:-backend};Username=${POSTGRES_USER:-backend};Password=${POSTGRES_PASSWORD:-backend}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend}
      POSTGRES_USER: ${POSTGRES_USER:-backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backend}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      # Sem isto, a API sobe antes de o banco aceitar conexão e morre no primeiro acesso.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend} -d ${POSTGRES_DB:-backend}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    build:
      context: .
      target: migrations
    environment:
      ConnectionStrings__Postgres: *conexao
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: *conexao
      Jwt__ChaveSecreta: ${JWT_CHAVE_SECRETA:?defina JWT_CHAVE_SECRETA no .env}
      Criptografia__ChaveDeDados: ${CRIPTOGRAFIA_CHAVE:?defina CRIPTOGRAFIA_CHAVE no .env}
      Documentacao__Habilitada: "true"
      Google__ClientId: ${Google__ClientId:-}
      Seed__AoIniciar: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@localhost}
      Seed__AdminSenha: ${ADMIN_SENHA:?defina ADMIN_SENHA no .env}
      Armazenamento__CaminhoLocal: /app/arquivos
      Aplicacao__Nome: ${APP_NOME:-Backend}
      Aplicacao__UrlDoFrontend: ${APP_URL_FRONTEND:-http://localhost:3000}
      Aplicacao__UrlDoSite: ${APP_URL_SITE:-http://localhost:5180}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Provedor Local guarda no disco do container; o volume faz os arquivos
      # sobreviverem ao restart. Em produção o provedor é o S3.
      - arquivos-dados:/app/arquivos
      # appsettings.Development.json não vai mais na imagem (ver Backend.Api.csproj): ele traz os
      # segredos de dev e o seed do admin, e não pode ir para produção. Em desenvolvimento ele é
      # montado aqui, para o container ter CORS, cookie SameSite=None, segredo do convite e o resto
      # sem depender de um arquivo com segredo dentro da imagem.
      - ./src/Backend.Api/appsettings.Development.json:/app/appsettings.Development.json:ro
    depends_on:
      migrations:
        condition: service_completed_successfully

  # Cria o primeiro administrador, uma vez. Não roda no "up": só quando chamado.
  #
  #   docker compose --profile bootstrap run --rm bootstrap
  #
  # Em desenvolvimento a API já cria o admin pelo seed; este serviço existe para exercitar o mesmo
  # comando que a produção usa — lá a API se recusa a subir com Seed__AoIniciar (RecusasDeProducao).
  bootstrap:
    profiles: ["bootstrap"]
    build:
      context: .
      target: api
    command: ["bootstrap-admin"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: *conexao
      Jwt__ChaveSecreta: ${JWT_CHAVE_SECRETA:?defina JWT_CHAVE_SECRETA no .env}
      Criptografia__ChaveDeDados: ${CRIPTOGRAFIA_CHAVE:?defina CRIPTOGRAFIA_CHAVE no .env}
      Festa__SegredoDoConvite: ${FESTA_SEGREDO_DO_CONVITE:-VU6PKg0QR+dtQxvOjR0BJ2jKa4Lccg5X1WJ2ybS2qO0=}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@localhost}
      Seed__AdminSenha: ${ADMIN_SENHA:?defina ADMIN_SENHA no .env}
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: "no"

  worker:
    build:
      context: .
      target: worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: *conexao
      Jwt__ChaveSecreta: ${JWT_CHAVE_SECRETA:?defina JWT_CHAVE_SECRETA no .env}
      Criptografia__ChaveDeDados: ${CRIPTOGRAFIA_CHAVE:?defina CRIPTOGRAFIA_CHAVE no .env}
      Aplicacao__Nome: ${APP_NOME:-Backend}
      Aplicacao__UrlDoFrontend: ${APP_URL_FRONTEND:-http://localhost:3000}
      Aplicacao__UrlDoSite: ${APP_URL_SITE:-http://localhost:5180}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    volumes:
      # Mesmo motivo da API: o arquivo saiu da imagem e é montado só no desenvolvimento. Sem ele o
      # worker perderia o desvio de e-mail (Smtp:RedirecionarPara) e mandaria e-mail para gente real.
      - ./src/Backend.Worker/appsettings.Development.json:/app/appsettings.Development.json:ro
    depends_on:
      migrations:
        condition: service_completed_successfully

volumes:
  postgres-dados:
  arquivos-dados:
